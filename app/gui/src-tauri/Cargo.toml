[package]
name = "veiled"
version = "0.5.1"
description = "Veiled - Peace Protocol Encrypted Data Marketplace"
edition = "2021"
rust-version = "1.89.0"

[lib]
name = "veiled_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "net"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream"], default-features = false }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zstd = "0.13"
tempfile = "3"
libc = "0.2"
base64 = "0.22"
sha2 = "0.10"
zeroize = "1"
percent-encoding = "2"
bip39 = { version = "2", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac", "ogg", "aac", "isomp4", "pcm", "vorbis"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
sys-locale = "0.3.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
